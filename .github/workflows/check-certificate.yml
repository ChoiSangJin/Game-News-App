name: Check registered signing certificate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check public certificate only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          python3 scripts/check_signing.py
          python3 - <<'PY'
          import hashlib, os, subprocess
          p=subprocess.run(['keytool','-exportcert','-keystore','android/app/release.jks','-storepass:env','ANDROID_KEYSTORE_PASSWORD','-alias',os.environ['ANDROID_KEY_ALIAS']],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
          digest=hashlib.sha256(p.stdout).hexdigest()
          print('::notice::REGISTERED_CERTIFICATE_SHA256='+digest)
          print('::notice::MATCHES_RELEASE_BASELINE='+str(digest=='ebd50026880286899e286b7cab2a240aed5b64a3b19b5a1b12addc6a8d2b8d6e'))
          PY
      - name: Remove temporary keystore
        if: always()
        run: rm -f android/app/release.jks android/app/signing-preflight.p12
