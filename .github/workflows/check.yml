name: Android checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/game-brief-analyze.log
      - name: Tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/game-brief-tests.log
      - name: Validation summary
        if: always()
        run: |
          for file in /tmp/game-brief-analyze.log /tmp/game-brief-tests.log; do
            if test -f "$file"; then
              printf '\n### %s\n\n```text\n' "$(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
              tail -150 "$file" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: game-brief-arm64-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
