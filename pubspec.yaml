name: game_news_app
description: Local-first Android game news and release calendar.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.5.0
  xml: ^6.6.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  google_mlkit_translation: ^0.13.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 23
  adaptive_icon_background: '#101727'
  adaptive_icon_foreground: assets/icon.png
